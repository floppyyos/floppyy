<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Floppyy DOS Player</title>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #dos {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="dos"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var bundle = params.get("bundle");
        // Faster mouse: js-dos movement multiplier = 0.1 + 3 * value.
        // Default 0.5 (~1.6x) feels sluggish; 1.5 gives ~4.6x for snappy aiming.
        try {
          localStorage.setItem("mouse_sensitivity", "1.5");
        } catch (e) {}
        if (!bundle || typeof Dos === "undefined") return;
        Dos(document.getElementById("dos"), {
          url: bundle,
          pathPrefix: "https://v8.js-dos.com/latest/emulators/",
          backend: "dosbox",
          theme: "dark",
          kiosk: true,
          autoStart: true,
          noCloud: true,
          imageRendering: "pixelated",
          renderAspect: "4/3",
        });
      })();
    </script>
  </body>
</html>
